# kplex: receives rtl-ais on this computer and sends the sentences on to each network.
# Start rtl-ais with:   rtl_ais -h localhost -P 10111
# Get <your-host> and <your-port> on https://gangwayais.com/stations/feed-us/

[udp]
direction=in
port=10111

[udp]
direction=out
address=<your-host>
port=<your-port>
ofilter=+AIVDM:-all

# Another network you feed, as one more block:
# [udp]
# direction=out
# address=<other-network-host>
# port=<other-network-port>
