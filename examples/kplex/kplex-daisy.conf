# kplex: a dAISy receiver on USB, sent on to Gangway AIS by UDP.
# Get <your-host> and <your-port> on https://gangwayais.com/stations/feed-us/
# Add one [udp] block per network you feed.

[serial]
filename=/dev/ttyACM0
direction=in
baud=38400

[udp]
direction=out
address=<your-host>
port=<your-port>
ofilter=+AIVDM:-all
