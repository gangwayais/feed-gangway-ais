# kplex: a Class B transponder's NMEA 0183 output, sent on to Gangway AIS by UDP.
# Only the !AIVDM sentences of other vessels go out. Your own !AIVDO and your
# instrument data stay on board.
# Get <your-host> and <your-port> on https://gangwayais.com/stations/feed-us/

# Choose one input. A serial output (check the baud rate in the manual):
[serial]
filename=/dev/ttyUSB0
direction=in
baud=38400

# Or the transponder's own network port, if it has one (TCP):
# [tcp]
# mode=client
# address=<transponder-address>
# port=<transponder-port>
# direction=in

[udp]
direction=out
address=<your-host>
port=<your-port>
ofilter=+AIVDM:-all
